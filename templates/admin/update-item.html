{% extends 'admin_base.html' %}

{% block title %}
Update Product
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='updateitem.css') }}">
{% endblock %}

{% block content %}

<div class="update-container">

    <div class="update-card">

        <div class="page-header">

            <i class="fa-solid fa-pen-to-square"></i>

            <h1>Update Product</h1>

            <p>Modify product information</p>

        </div>

        <form method="POST"
              enctype="multipart/form-data">

            <div class="image-section">

                {% if product.image %}

                <img src="/static/uploads/product_images/{{ product.image }}"
                     alt="{{ product.name }}">

                {% endif %}

            </div>

            <div class="form-group">

                <label>Product Name</label>

                <input type="text"
                       name="name"
                       value="{{ product.name }}"
                       required>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea name="description"
                          rows="5"
                          required>{{ product.description }}</textarea>

            </div>

            <div class="form-group">

                <label>Category</label>

                <input type="text"
                       name="category"
                       value="{{ product.category }}"
                       required>

            </div>

            <div class="form-group">

                <label>Price (₹)</label>

                <input type="number"
                       step="0.01"
                       name="price"
                       value="{{ product.price }}"
                       required>

            </div>

            <div class="form-group">

                <label>Change Product Image</label>

                <input type="file"
                       name="image"
                       accept="image/*">

            </div>

            <div class="button-group">

                <button type="submit"
                        class="update-btn">

                    Update Product

                </button>

                <a href="/admin/item-list"
                   class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
