{% extends 'base.html' %}

{% block title %}
Delivery Address
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='address.css') }}">
{% endblock %}

{% block content %}

<div class="address-container">

    <div class="address-card">

        <div class="page-header">

            <i class="fa-solid fa-location-dot"></i>

            <h1>Delivery Address</h1>

            <p>Enter your shipping details</p>

        </div>

        <form method="POST" action="/user/address">

            <div class="form-group">

                <label>Full Name</label>

                <input type="text"
                       name="fullname"
                       value="{{ address.fullname if address else '' }}"
                       placeholder="Enter Full Name"
                       required>

            </div>

            <div class="form-group">

                <label>Mobile Number</label>

                <input type="tel"
                       name="mobile"
                       value="{{ address.mobile if address else '' }}"
                       placeholder="Enter Mobile Number"
                       required>

            </div>

            <div class="form-group">

                <label>House No / Street</label>

                <textarea name="address"
                          rows="3"
                          placeholder="Enter House No, Street, Area"
                          required>{{ address.address if address else '' }}</textarea>

            </div>

            <div class="row">

                <div class="form-group">

                    <label>City</label>

                    <input type="text"
                           name="city"
                           value="{{ address.city if address else '' }}"
                           placeholder="Enter City"
                           required>

                </div>

                <div class="form-group">

                    <label>State</label>

                    <input type="text"
                           name="state"
                           value="{{ address.state if address else '' }}"
                           placeholder="Enter State"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="form-group">

                    <label>Pincode</label>

                    <input type="text"
                           name="pincode"
                           value="{{ address.pincode if address else '' }}"
                           placeholder="Enter Pincode"
                           required>

                </div>

                <div class="form-group">

                    <label>Landmark</label>

                    <input type="text"
                           name="landmark"
                           value="{{ address.landmark if address else '' }}"
                           placeholder="Nearby Landmark">

                </div>

            </div>

            <button type="submit" class="save-btn">
                Proceed to Payment
            </button>

        </form>

    </div>

</div>

{% endblock %}
