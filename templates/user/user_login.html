{% extends 'base.html' %}

{% block title %}
User Login
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='userlogin.css') }}">
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>User Login</h1>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <a href="#">Forgot Password?</a>

        <a href="/user-register">
            Create New Account?
        </a>

    </div>

</div>

{% endblock %}
